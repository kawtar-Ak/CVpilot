spring:
  application:
    name: cvpilot-backend
  datasource:
    url: jdbc:mysql://localhost:3306/cvpilot?useSSL=false&serverTimezone=UTC
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    database-platform: org.hibernate.dialect.MySQLDialect
server:
  port: 8080